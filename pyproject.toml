[project]
name = "multi-agent-coder"
version = "0.1.0"
description = "Autonomous Multi-Agent Researcher and Coder with Self-Healing Loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "rich>=13.7.0",
    "pytest>=8.2.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# TODO(T1.2): structured error taxonomy
"src/agents/base.py" = ["BLE001"]
"src/agents/supervisor.py" = ["BLE001", "E501"]
"src/agents/tester.py" = ["BLE001", "E501"]
"src/tools/file_tools.py" = ["BLE001"]
"src/tools/shell_tools.py" = ["BLE001"]
# TODO(T4.3): style cleanup
"src/agents/coder.py" = ["E501"]
"src/graph.py" = ["E501"]
"src/main.py" = ["E501"]
