[project]
name = "multi-agent-coder"
version = "0.2.0"
description = "Autonomous Multi-Agent Researcher and Coder with Self-Healing Loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.40.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "tenacity>=8.3.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.25.0",
]
cost = [
    "tiktoken>=0.7.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: live network tests (deselect with -m 'not integration')"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# TODO(T1.2): structured error taxonomy
"src/agents/base.py" = ["BLE001"]
"src/agents/supervisor.py" = ["BLE001", "E501"]
"src/agents/tester.py" = ["BLE001", "E501"]
"src/tools/file_tools.py" = ["BLE001"]
"src/tools/shell_tools.py" = ["BLE001"]
# TODO(T4.3): style cleanup
"src/agents/coder.py" = ["E501"]
"src/graph.py" = ["E501"]
"src/main.py" = ["E501"]
